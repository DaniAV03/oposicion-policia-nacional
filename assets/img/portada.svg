<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
  <title>Emblema con estrella y libro abierto</title>
  <!-- Paleta de la hoja de estilos: placa en el acento suave, acento principal para
       el escudo y el libro, detalle cálido para la estrella y tinta de línea propia
       de la ilustración. El anillo del acento es lo que separa la placa de la banda
       tintada del héroe: sin él las dos superficies claras se fundían y el borde del
       escudo se perdía. -->
  <rect x="4" y="4" width="192" height="192" rx="36" fill="#e3edfd" stroke="#0b5bc4" stroke-width="6" />
  <path d="M100 26 146 42v34c0 20-18 34-46 44-28-10-46-24-46-44V42Z" fill="#0b5bc4" stroke="#0b0d12" stroke-width="6" stroke-linejoin="round" />
  <path d="M100 45 105 59.1 119.9 59.5 108.1 68.6 112.3 83 100 74.5 87.7 83 91.9 68.6 80 59.5 95 59.1Z" fill="#c2410c" stroke="#0b0d12" stroke-width="5" stroke-linejoin="round" />
  <g stroke="#0b0d12" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 108c-14-11-38-12-56-7v67c18-5 42-4 56 7Z" fill="#0b5bc4" />
    <path d="M100 108c14-11 38-12 56-7v67c-18-5-42-4-56 7Z" fill="#0b5bc4" />
  </g>
  <g fill="#ffffff">
    <path d="M100 115c-11-9-31-10-48-6v51c17-4 37-3 48 6Z" />
    <path d="M100 115c11-9 31-10 48-6v51c-17-4-37-3-48 6Z" />
  </g>
  <path d="M100 108v67" fill="none" stroke="#0b0d12" stroke-width="6" stroke-linecap="round" />
</svg>
