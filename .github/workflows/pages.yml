name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Regenerar el índice de temas desde la fuente oficial
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/build-programa.mjs
      - run: node scripts/verificar.mjs
      - run: node scripts/verificar-examenes.mjs
      - run: node scripts/verificar-test.mjs
      - run: node scripts/verificar-banco.mjs
      - run: node scripts/verificar-contraste.mjs

      - name: Preparar el sitio estático
        uses: actions/configure-pages@v6

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v5
